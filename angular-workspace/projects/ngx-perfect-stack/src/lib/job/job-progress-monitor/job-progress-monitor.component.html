
@if (job(); as job) {
  @if (job.status === 'Error') {
    <ngb-progressbar class="mb-2" [showValue]="true" type="danger" [value]="job.step_index + 1" [max]="job.step_count"></ngb-progressbar>
  } @else {
    <ngb-progressbar class="mb-2" [showValue]="true" type="info" [value]="job.step_index + 1" [max]="job.step_count"></ngb-progressbar>
  }
}

@if(timedOut()) {
  <div class="text-danger">Job has not completed within the allowable time.</div>
}
