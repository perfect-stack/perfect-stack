@for (rowItem of [].constructor(rowCount); track rowItem; let rowIdx = $index) {
  <div class="row g-3 pb-3">
    @for (colItem of [].constructor(width); track colItem; let colIdx = $index) {
      <div class="col">
        @if (doesButtonExist(colIdx, rowIdx)) {
          <div>
            <button class="btn btn-outline-secondary tile-btn w-100"
              [ngClass]="{'tile-btn-selected': isSelected(colIdx, rowIdx)}"
              [disabled]="!isEnabled(colIdx, rowIdx)"
              (click)="onButtonClicked(colIdx, rowIdx)">
              <div class="btn-icon material-symbols-outlined" [ngClass]="{'btn-icon-disabled': !isEnabled(colIdx, rowIdx)}">{{getButton(colIdx, rowIdx).icon}}</div>
              <div>{{getButton(colIdx, rowIdx).name}}</div>
              @if (selectionMode === 'single') {
                @if (isSelected(colIdx, rowIdx)) {
                  <span class="btn-icon btn-radio material-symbols-outlined btn-radio-selected">radio_button_checked</span>
                }
                @if (!isSelected(colIdx, rowIdx)) {
                  <span class="btn-icon btn-radio material-symbols-outlined">radio_button_unchecked</span>
                }
              }
              @if (selectionMode === 'multiple') {
                @if (isSelected(colIdx, rowIdx)) {
                  <span class="btn-icon material-symbols-outlined icon-filled btn-check-selected">check_box</span>
                }
              }
            </button>
          </div>
        }
      </div>
    }
  </div>
}
