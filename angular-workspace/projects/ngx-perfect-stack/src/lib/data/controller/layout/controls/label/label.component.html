@if (!labelHidden && cell.component !== 'FlexibleDateTime') {
  <div class="row">
    @if (isShowLabelTop(cell)) {
      <label class="col" [for]="attribute.name" id="{{attribute.name}}Lbl">
        <span placement="right" [ngbTooltip]="attribute.description">{{attribute.label}}</span>
        @if (mode == 'edit') {
          @if (attribute.visibility == 'Required') {
            <span class="text-danger ps-1">*</span>
          }
        }
      </label>
      @if (secondaryAttribute) {
        <label class="col" id="{{attribute.name}}Lbl">
          <span placement="right" [ngbTooltip]="secondaryAttribute.description">{{secondaryAttribute.label}}</span>
          @if (mode == 'edit') {
            @if (secondaryAttribute.visibility == 'Required') {
              <span class="text-danger">*</span>
            }
          }
        </label>
      }
    }
    @if (isShowLabelLeft(cell)) {
      <!-- if LabelLayoutType === Left then just show the label -->
      <label class="col" [for]="attribute.name" id="{{attribute.name}}Lbl">
        <span placement="right" [ngbTooltip]="attribute.description">{{attribute.label}}</span>
        @if (mode == 'edit') {
          @if (attribute.visibility == 'Required') {
            <span class="text-danger ps-1">*</span>
          }
        }
      </label>
      <!-- Don't need to show the secondary attribute name if label is on left -->
    }
  </div>
}

@if (!labelHidden && cell.component === 'FlexibleDateTime') {
  <div class="row">
    @if (mode === 'view') {
      <label class="col" [for]="attribute.name" id="{{attribute.name}}Lbl">
        <span placement="right" [ngbTooltip]="attribute.description">{{attribute.label}}</span>
      </label>
    }
    @if (mode !== 'view') {
      <!--<div class="row">
      <label class="col-3">Date</label>
      <label class="col-3">Time</label>
      <label class="col-1 label-hidden">- or -</label>
      <label class="col-5">Unsure of the time?</label>
    </div>-->
  }
</div>
}
