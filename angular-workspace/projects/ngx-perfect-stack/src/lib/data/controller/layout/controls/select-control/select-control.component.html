@if (mode !== 'view' && !cell?.displayOnly) {
  <div class="input-group" [attr.data-testid]="'field-' + (attribute?.name || ngControl.name)">
    <select [id]="ngControl.name || attribute?.name" [attr.name]="attribute?.name || ngControl.name"
      [attr.data-testid]="'select-' + (attribute?.name || ngControl.name)"
      [disabled]="isReadOnly() || disabled"
      [ngModel]="selectedEntity" (ngModelChange)="onModelChange($event)" [compareWith]="byEntityOrId"
      [ngModelOptions]="{standalone: true}"
      [ngClass]="{
        'form-control': isReadOnly(),
        'form-select': !isReadOnly(),
        'ng-invalid': ngControl.invalid,
        'ng-touched': ngControl.touched
      }">
      <option [ngValue]="null">
        @if (isLoading) {
          Loading {{attribute?.name || 'options'}}...
        } @else {
          -- Select {{attribute?.label || attribute?.name || ''}} --
        }
      </option>
      @for (o of optionList; track (o.id || $index)) {
        <option [ngValue]="o">{{getDisplayText(o)}}</option>
      }
    </select>
  </div>
  @if (hasErrors() && cell?.attribute) {
    <lib-validation-result-label [attribute]="cell.attribute" [validationResult]="validationResult"></lib-validation-result-label>
  }
}

@if (mode === 'view' || cell?.displayOnly) {
  @if (selectedEntityId && selectedEntity) {
    <div class="input-group" [attr.data-testid]="'field-' + attribute?.name">
      <input class="form-control" readonly [id]="attribute?.name" [attr.data-testid]="'view-' + attribute?.name" value="{{getDisplayText(selectedEntity)}}">
    </div>
  }
  @if (!selectedEntityId) {
    <div class="input-group" [attr.data-testid]="'field-' + attribute?.name">
      <input class="form-control empty-value" readonly [id]="attribute?.name" [attr.data-testid]="'view-' + attribute?.name" value="&mdash;">
    </div>
  }
}
