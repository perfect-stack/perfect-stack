@if (linkFragments) {
  @for (nextFragment of linkFragments; track nextFragment) {
    @switch (nextFragment.type) {
      @case ('Text') {
        <span (click)="onClick($event)">{{nextFragment.text}}</span>
      }
      @case ('Link') {
        <span><a href="#" (click)="onClick($event)">{{nextFragment.text}}</a></span>
      }
      @default {
        <span (click)="onClick($event)">UNKNOWN LinkFragment type of {{nextFragment.type}}</span>
      }
    }
  }
}
