
@if (editorMode) {
  <div (click)="doEditorAction()">MAP goes here...</div>
}

@if (!editorMode && options) {
  <div [ngStyle]="{'height': height}"
    leaflet
    [leafletOptions]="options"
    [(leafletCenter)]="center"
    [leafletBaseLayers]="baseLayers"
    (leafletClick)="onMapClick($event)"
    >
    @for (l of layers; track l) {
      <div [leafletLayer]="l"></div>
    }
    <div [ngClass]="{'overlay-bottom-left': ctx.mode === 'edit'}">
      Shift+Click to set coordinates
    </div>
  </div>
}
