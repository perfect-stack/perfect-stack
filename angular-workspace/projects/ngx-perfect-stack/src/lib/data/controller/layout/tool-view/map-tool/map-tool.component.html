@if (editorMode) {
  <div (click)="doEditorAction()">MAP goes here...</div>
}

@if (!editorMode) {
  <div class="map-wrapper" style="position: relative;" [ngStyle]="{'height': height}">
    <div
      #mapContainer
      class="esri-view"
      [attr.data-has-marker]="hasMarker ? 'true' : null"
      style="width: 100%; height: 100%;">
    </div>
  </div>
}
