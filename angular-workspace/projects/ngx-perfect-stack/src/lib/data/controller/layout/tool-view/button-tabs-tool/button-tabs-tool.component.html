@if (tabContext$ | async; as tabContext) {
  <div class="row form-row">
    <label class="col-12" id="{{buttonTabsTool.label}}">
      {{buttonTabsTool.label}}
    </label>
    <div class="col-12 pb-4">
      <lib-button-group-tool [buttonGroupTool]="tabContext.buttonGroupTool" [editorMode]="false" [ctx]="ctx" (action)="onTabSelected($event, tabContext)"></lib-button-group-tool>
      @if (editorMode) {
        <div class="material-symbols-outlined" (click)="doEditorAction()">settings</div>
      }
    </div>
    <div class="col-12 pb-4">
      @if (selectedTemplate) {
        <lib-layout [ctx]="ctx" [template]="selectedTemplate"></lib-layout>
      }
    </div>
  </div>
}
