<div [formGroup]="formGroup">
  @if (mode !== 'view') {
    <div class="row">
      @if (cell && cell.attribute && cell.attribute.name) {
        <div class="col-6">
          <app-date-picker-control [mode]="mode" [attribute]="cell.attribute" [formControlName]="cell.attribute.name" [includesTimeValue]="true"></app-date-picker-control>
        </div>
      }
      @if (cell && cell.attribute && cell.attribute.name) {
        <div class="col-6">
          <lib-time-control [mode]="mode" [cell]="cell" [formControlName]="cell.attribute.name" [includesDate]="true"></lib-time-control>
        </div>
      }
    </div>
  }

  @if (mode === 'view') {
    <div class="row">
      <div class="col-12">
        @if (dateTimeValue) {
          <div class="form-control" readonly>
            {{dateTimeValue}}
          </div>
        }
        @if (!dateTimeValue) {
          <div class="form-control empty-value" readonly>&mdash;</div>
        }
      </div>
    </div>
  }
</div>
