
<input class="form-control"
  [readonly]="disabled"
  (change)="onTimeChanged($event)"
  [ngModel]="timeModel"
  [ngClass]="{'ng-invalid': hasErrors(), 'ng-touched': touched}"
  type="time">

@if (showModifiers) {
  @for (modifier of modifierList; track modifier) {
    <span class="badge bg-primary me-1" (click)="onModify(modifier, $event)">
      <span role="button">{{modifier.label}}</span>
    </span>
  }
}

@if (!parentDisplaysError && hasErrors() && cell.attribute) {
  <lib-validation-result-label [attribute]="cell.attribute" [validationResult]="validationResult"></lib-validation-result-label>
}
