@if (!isReadOnly()) {
  <div class="geometry-edit-container position-relative" [attr.data-testid]="'field-' + attributeName()">
    <div class="geometry-action-buttons">
      <button type="button"
              class="btn btn-sm btn-light border geometry-action-btn"
              title="Format GeoJSON"
              [disabled]="!hasValue() || hasErrors()"
              (click)="formatGeoJson()"
              [attr.data-testid]="'format-edit-' + attributeName()">
        <span class="material-symbols-outlined action-icon">format_align_left</span>
      </button>
      <button type="button"
              class="btn btn-sm btn-light border geometry-action-btn"
              [title]="copied() ? 'Copied!' : 'Copy GeoJSON'"
              [disabled]="!hasValue()"
              (click)="copyToClipboard()"
              [attr.data-testid]="'copy-edit-' + attributeName()">
        <span class="material-symbols-outlined action-icon">{{ copied() ? 'check' : 'content_copy' }}</span>
      </button>
    </div>

    <textarea rows="6"
              class="form-control font-monospace geometry-textarea"
              [class.is-invalid]="hasErrors() && touched"
              [id]="attributeName()"
              [name]="attributeName()"
              [disabled]="disabled"
              [value]="rawText()"
              (input)="onTextInput($event)"
              (blur)="onBlur()"
              placeholder="Paste or enter GeoJSON here..."
              [attr.data-testid]="'textarea-' + attributeName()"></textarea>

    @if (hasErrors() && touched && validationResult && attribute) {
      <div class="mt-1">
        <lib-validation-result-label [attribute]="attribute"
                                     [validationResult]="validationResult"></lib-validation-result-label>
      </div>
    }
  </div>
}

@if (isReadOnly()) {
  @if (hasValue()) {
    <div class="geometry-view-container position-relative"
         [class.is-expanded]="isExpanded()"
         [attr.data-testid]="'field-' + attributeName()"
         (click)="onViewControlClick($event)">

      <div class="geometry-action-buttons" (click)="$event.stopPropagation()">
        <button type="button"
                class="btn btn-sm btn-light border geometry-action-btn"
                (click)="toggleExpanded()"
                [title]="isExpanded() ? 'Contract' : 'Expand'"
                [attr.data-testid]="'expand-view-' + attributeName()">
          <span class="material-symbols-outlined action-icon">{{ isExpanded() ? 'unfold_less' : 'unfold_more' }}</span>
        </button>
        <button type="button"
                class="btn btn-sm btn-light border geometry-action-btn"
                (click)="copyToClipboard()"
                [title]="copied() ? 'Copied!' : 'Copy GeoJSON'"
                [attr.data-testid]="'copy-view-' + attributeName()">
          <span class="material-symbols-outlined action-icon">{{ copied() ? 'check' : 'content_copy' }}</span>
        </button>
      </div>

      @if (!isExpanded()) {
        <div class="form-control font-monospace geometry-view-single text-truncate"
             [id]="attributeName()"
             [title]="'Click to expand'"
             [attr.data-testid]="'view-' + attributeName()">
          {{ singleLineText() }}
        </div>
      }

      @if (isExpanded()) {
        <div class="form-control font-monospace geometry-view-multi"
             [id]="attributeName()"
             [title]="'Click to contract'"
             [attr.data-testid]="'view-' + attributeName()">
          <pre class="m-0 font-monospace geometry-pre"><code>{{ multiLineText() }}</code></pre>
        </div>
      }
    </div>
  }

  @if (!hasValue()) {
    <div class="geometry-view-container" [attr.data-testid]="'field-' + attributeName()">
      <div class="form-control empty-value d-flex align-items-center"
           [id]="attributeName()"
           [attr.data-testid]="'view-' + attributeName()">
        <span>&mdash;</span>
      </div>
    </div>
  }
}
