
@switch (validationResult.resultType) {
  @case ('Error') {
    <span class="validation-result text-danger">{{validationResult.message}}</span>
  }
  @case ('Info') {
    <span class="validation-result text-info">{{validationResult.message}}</span>
  }
  @case ('Warning') {
    <span class="validation-result text-warning">{{validationResult.message}}</span>
  }
}
