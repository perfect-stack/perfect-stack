@switch (validationResult.resultType) {
  @case ('Error') {
    <span class="validation-result text-danger" [attr.data-testid]="'error-' + (attribute?.name || 'validation')">{{validationResult.message}}</span>
  }
  @case ('Info') {
    <span class="validation-result text-info" [attr.data-testid]="'info-' + (attribute?.name || 'validation')">{{validationResult.message}}</span>
  }
  @case ('Warning') {
    <span class="validation-result text-warning" [attr.data-testid]="'warning-' + (attribute?.name || 'validation')">{{validationResult.message}}</span>
  }
}
