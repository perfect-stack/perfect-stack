<lib-permission-check [action]="buttonTool.actionPermit" [subject]="buttonTool.subjectPermit">
  <button [ngClass]="buttonTool.styles" (click)="onClick()">
    @if (buttonTool.icon) {
      <div class="d-flex align-items-center">
        <span class="material-symbols-outlined pe-1">{{buttonTool.icon}}</span>
        {{buttonTool.label}}
      </div>
    }
    @if (!buttonTool.icon) {
      {{buttonTool.label}}
    }
  </button>
</lib-permission-check>
