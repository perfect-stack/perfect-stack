@if (cell && cell.template) {
  <div class="border-top">
    @if (cell && cell.attribute && cell.attribute.name) {
      <lib-layout
        [mode]="mode"
        [ctx]="ctx"
        [template]="cell.template"
        [formGroup]="formGroup"
        [relationshipProperty]="cell.attribute.name">
      </lib-layout>
    }
  </div>
}
