@if (metaPage$ | async; as metaPage) {
  <div class="m-3">
    <h2>Meta Page Edit</h2>
    <form class="form mt-3" #form="ngForm" [formGroup]="metaPageForm">
      <div class="row">
        <div class="col-2">
          <label class="form-label" for="name">Name</label>
          <input class="form-control" type="text" id="name" formControlName="name">
        </div>
        <div class="col-2">
          <label class="form-label" for="title">Title</label>
          <input class="form-control" type="text" id="title" formControlName="title">
        </div>
        <div class="col-2">
          <label class="form-label" for="type">Type</label>
          <select class="form-select" id="type" formControlName="type">
            @for (o of getPageTypeOptions(); track o) {
              <option [ngValue]="o">{{o}}</option>
            }
          </select>
        </div>
        <div class="col-2">
          <label class="form-label" for="layoutStyle">Layout style</label>
          <select class="form-select" id="layoutStyle" formControlName="layoutStyle">
            @for (o of getLayoutStyleOptions(); track o) {
              <option [ngValue]="o">{{o}}</option>
            }
          </select>
        </div>
      </div>
    </form>
  </div>

  <ul ngbNav #nav="ngbNav" [(activeId)]="activeTab" [destroyOnHide]="false" class="nav-tabs mx-3">
    <li [ngbNavItem]="'template'">
      <button ngbNavLink>Template</button>
      <ng-template ngbNavContent>
        <div class="row">
          <div class="col-10 pe-3">
            @for (nextTemplate of templates; track nextTemplate; let i = $index) {
              <div class="mb-4">
                <lib-template-controller [template]="nextTemplate" (deleteTemplate)="onDeleteTemplate($event, i)"></lib-template-controller>
              </div>
            }

            <div class="add-template-end-card text-center p-3 mb-4">
              <div class="text-muted small mb-2">Append a new section to this page</div>
              <div ngbDropdown class="d-inline-block">
                <button type="button" class="btn btn-outline-secondary d-flex align-items-center gap-1 mx-auto" id="addTemplateBottomDropdown" ngbDropdownToggle [disabled]="!(isMetaEditEnabled$ | async)">
                  <span class="material-symbols-outlined" style="font-size: 18px;">add</span>
                  <span>Add Template</span>
                </button>
                <div ngbDropdownMenu aria-labelledby="addTemplateBottomDropdown" class="shadow-sm">
                  <button ngbDropdownItem class="d-flex align-items-center gap-2 py-2" (click)="onAddTemplate(TemplateType.form)">
                    <span class="material-symbols-outlined text-primary" style="font-size: 20px;">article</span>
                    <div>
                      <div class="fw-semibold">Form Template</div>
                      <small class="text-muted">Standard form with editable cells & fields</small>
                    </div>
                  </button>
                  <button ngbDropdownItem class="d-flex align-items-center gap-2 py-2" (click)="onAddTemplate(TemplateType.table)">
                    <span class="material-symbols-outlined text-success" style="font-size: 20px;">table_chart</span>
                    <div>
                      <div class="fw-semibold">Table Template</div>
                      <small class="text-muted">Tabular layout for list/search results</small>
                    </div>
                  </button>
                  <button ngbDropdownItem class="d-flex align-items-center gap-2 py-2" (click)="onAddTemplate(TemplateType.header)">
                    <span class="material-symbols-outlined text-info" style="font-size: 20px;">web_asset</span>
                    <div>
                      <div class="fw-semibold">Header Template</div>
                      <small class="text-muted">Top banner or summary header section</small>
                    </div>
                  </button>
                </div>
              </div>
            </div>
          </div>
          <div class="col-2 sticky-sidebar">
            <div class="sidebar-card mb-3">
              <div class="sidebar-card-header">
                <div class="d-flex align-items-center gap-2">
                  <span class="material-symbols-outlined header-icon">handyman</span>
                  <span class="header-title">Tools</span>
                </div>
              </div>
              <div class="sidebar-card-body">
                <lib-tool-palette></lib-tool-palette>
              </div>
            </div>
            <lib-property-sheet></lib-property-sheet>
            <lib-attribute-palette></lib-attribute-palette>
          </div>
        </div>
      </ng-template>
    </li>
    <li [ngbNavItem]="'data'">
      <button ngbNavLink>Data</button>
      <ng-template ngbNavContent>
        <lib-data-query-map [dataQueryList]="dataQueryList"></lib-data-query-map>
        <lib-controller-list [controllers]="controllers"></lib-controller-list>
      </ng-template>
    </li>
  </ul>

  <div [ngbNavOutlet]="nav" class="tab-content-panel mx-3"></div>

  <div class="d-flex my-5 px-3">
    <button class="btn btn-danger" [disabled]="!(isMetaEditEnabled$ | async)" (click)="onDelete(metaPage)">Delete</button>
    <div class="flex-grow-1"></div>
    <button class="btn btn-outline-primary me-2" [disabled]="!(isMetaEditEnabled$ | async)" (click)="onCancel()">Cancel</button>
    <button class="btn btn-primary" [disabled]="!(isMetaEditEnabled$ | async)" (click)="onSave()">Save</button>
  </div>
}
