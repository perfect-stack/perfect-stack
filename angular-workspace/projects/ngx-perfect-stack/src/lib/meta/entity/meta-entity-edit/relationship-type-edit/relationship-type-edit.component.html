<ng-container [formGroup]="formGroup">
  <div class="d-flex align-items-baseline">
    <div class="text-nowrap me-2">Entity target</div>
    <select class="form-select mt-1" formControlName="relationshipTarget">
      @for (o of metaEntityOptions; track o) {
        <option [ngValue]="o.name">{{o.name}}</option>
      }
    </select>
  </div>
  @if (isManyToOne()) {
    <div class="d-flex align-items-baseline">
      <div class="text-nowrap me-2">Add search term</div>
      @if (targetMetaEntity) {
        <select class="form-select mt-1" (change)="onTypeaheadSearchChange($event)">
          <option value=""></option>
          @for (o of targetMetaEntity.attributes; track o) {
            <option [value]="o.name">{{o.label}}</option>
          }
        </select>
      }
      @if (!targetMetaEntity) {
        <i>...select target entity</i>
      }
    </div>
    <div class="d-flex align-items-baseline mt-2">
      @if (typeaheadSearchControl) {
        <div>
          @for (searchTerm of typeaheadSearchControl.value; track searchTerm; let i = $index) {
            <span class="badge bg-success me-1">
              <span>{{toAttributeLabel(searchTerm)}}</span><span class="material-symbols-outlined small" (click)="removeSearchTerm(i)">close</span>
            </span>
          }
        </div>
      }
    </div>
  }
</ng-container>
