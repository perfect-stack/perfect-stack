@if (metaMenu$ | async; as metaMenu) {
  <div class="m-3">
    <h2>Meta Menu Edit</h2>

    <div class="menu-editor-panel mt-3">
      <div class="menu-board">
        @for (menu of metaMenu.menuList; track menu; let colIdx = $index) {
          <div class="menu-column-card">
            <div class="menu-column-header">
              <lib-menu-header-view
                [menu]="menu"
                (menuAdded)="onMenuAdded(metaMenu, colIdx)"
                (menuDeleted)="onMenuDeleted(metaMenu, colIdx)"
                (menuMoved)="onMenuMove(metaMenu, colIdx, $event)">
              </lib-menu-header-view>
            </div>
            <div class="menu-column-body">
              @for (item of menu.items; track item; let rowIdx = $index) {
                <lib-menu-item-view
                  [menu]="menu"
                  [menuItem]="item"
                  (menuItemDeleted)="onMenuItemDeleted(metaMenu, colIdx, rowIdx)"
                  (menuItemMoved)="onMenuItemMoved(metaMenu, colIdx, rowIdx, $event)"
                  (menuItemMenuMoved)="onMenuItemMenuMoved(metaMenu, colIdx, rowIdx, $event)">
                </lib-menu-item-view>
              }

              <button type="button" class="btn add-item-btn w-100" (click)="onAddItem(metaMenu, colIdx)">
                <span class="material-symbols-outlined me-1" style="font-size: 16px;">add</span>
                <span>Add Item</span>
              </button>
            </div>
          </div>
        }

        <div class="add-menu-column-card text-center p-3">
          <div class="text-muted small mb-2">Append a new menu</div>
          <button type="button" class="btn btn-outline-secondary d-flex align-items-center gap-1 mx-auto" (click)="onAddColumn(metaMenu)">
            <span class="material-symbols-outlined" style="font-size: 18px;">add</span>
            <span>Add Menu</span>
          </button>
        </div>
      </div>
    </div>

    <div class="d-flex my-5 px-3">
      <div class="flex-grow-1"></div>
      <button class="btn btn-outline-primary me-2" (click)="onCancel(metaMenu)">Cancel</button>
      <button class="btn btn-primary" (click)="onSaveMetaMenu(metaMenu)">Save</button>
    </div>
  </div>
}
