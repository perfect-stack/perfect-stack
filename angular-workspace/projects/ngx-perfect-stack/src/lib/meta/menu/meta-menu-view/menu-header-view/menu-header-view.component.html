@if (menu) {
  <div class="menu-header-bar d-flex align-items-center justify-content-between">
    <div class="d-flex align-items-center gap-2 header-title-area">
      <span class="material-symbols-outlined header-icon">folder</span>
      <span class="header-title">{{menu.label}}</span>
    </div>
    @if (mouseActive) {
      <div class="header-actions-overlay">
        <span class="material-symbols-outlined action-icon" (click)="onMove(-1)" title="Move Left">keyboard_arrow_left</span>
        <span class="material-symbols-outlined action-icon" (click)="onMove(+1)" title="Move Right">keyboard_arrow_right</span>
        <span class="material-symbols-outlined action-icon" (click)="onAdd()" title="Add Menu Left">add</span>
        <span class="material-symbols-outlined action-icon" (click)="onEditMenu(content)" title="Edit Menu">edit</span>
        <span class="material-symbols-outlined action-icon action-delete" (click)="onDelete()" title="Delete Menu">delete</span>
      </div>
    }
  </div>
}

<ng-template #content let-modal>
  <div class="modal-header">
    <h4 class="modal-title" id="modal-basic-title">Edit Menu</h4>
    <button type="button" class="btn-close" aria-label="Close" (click)="modal.dismiss('Cross click')"></button>
  </div>
  <div class="modal-body">
    <form [formGroup]="menuForm" (ngSubmit)="modal.close('Save click')">
      <div class="form-group mb-3">
        <label class="form-label" for="label">Label</label>
        <input id="label" class="form-control" [formControlName]="'label'">
      </div>
    </form>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-outline-primary" (click)="modal.dismiss('Cancel click')">Cancel</button>
    <button type="button" class="btn btn-primary" (click)="onSave(modal)">Save</button>
  </div>
</ng-template>
