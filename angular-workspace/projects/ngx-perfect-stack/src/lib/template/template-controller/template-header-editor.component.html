@if (template) {
  @if (metaEntityMap$ | async; as metaEntityMap) {
    @for (nextRow of template.cells; track nextRow) {
      <div class="d-flex flex-row align-items-center mb-1">
        @for (nextCell of nextRow; track nextCell) {
          <div class="min-cell-width">
            <lib-cell-view
              [metaEntity]="getMetaEntity(metaEntityMap, template.metaEntityName)"
              [cell]="nextCell"
              [attribute]="getAttribute(nextCell.attributeName, metaEntityMap, template.metaEntityName)"
              (changeWidth)="onChangeWidth($event, nextRow, nextCell)"
              (changeHeight)="onChangeHeight($event, nextRow, nextCell)"
              (deleteCell)="onDeleteCell($event, nextRow)">
            </lib-cell-view>
          </div>
        }
        @if (getTotalWidth(nextRow) < 12) {
          <div class="add-cell d-flex align-items-center justify-content-center" (click)="onAddCell(nextRow)" title="Add Cell">
            <div class="material-symbols-outlined no_selection">add</div>
          </div>
        }
      </div>
    }
    <div class="d-flex align-items-center my-3">
      <div class="btn-group btn-group-sm" role="group" aria-label="Add Rows">
        <button type="button" class="btn btn-outline-secondary d-flex align-items-center" (click)="onAddRow(1)">
          <span class="material-symbols-outlined me-1" style="font-size: 16px;">add</span> Add Row
        </button>
        <button type="button" class="btn btn-outline-secondary" (click)="onAddRow(5)">+5</button>
        <button type="button" class="btn btn-outline-secondary" (click)="onAddRow(10)">+10</button>
      </div>
      <div class="flex-grow-1"></div>
    </div>
  }
}
