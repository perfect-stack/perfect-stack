
<div class="tool-component-drop-zone drag-border" my-dropzone (myDropZoneDroppedEvent)="onDropEvent($event)">
  @if (!tool) {
    <span class="small text-secondary"><i>add tool here...</i></span>
  }

  @if (tool) {
    <lib-tool-view [tool]="tool" [editorMode]="editorMode"></lib-tool-view>
  }
</div>
