@if (metaEntityMap$ | async; as metaEntityMap) {
  <div class="template-header-bar d-flex align-items-center justify-content-between px-3 py-2"
       [class.selected]="selected"
       (click)="onClick(metaEntityMap, $event)">
    <div class="d-flex align-items-center flex-grow-1 me-3">
      <span class="material-symbols-outlined text-muted me-2 template-type-icon">
        @switch (template.type) {
          @case ('table') { table_chart }
          @case ('header') { view_headline }
          @default { feed }
        }
      </span>
      <input class="form-control form-control-sm template-title-input me-2"
             type="text"
             [(ngModel)]="template.templateHeading"
             placeholder="Template heading..."
             (click)="$event.stopPropagation()">
      <span class="badge rounded-pill template-badge">
        {{template.type | titlecase}} &bull; {{template.metaEntityName}}
      </span>
    </div>
    <div class="d-flex align-items-center">
      <lib-tool-drop-zone class="me-2" [template]="template" [templateLocationType]="TemplateLocationType.TopRight" [editorMode]="true"></lib-tool-drop-zone>
      <button type="button"
              class="btn-icon-round text-secondary me-1"
              title="Template Settings"
              (click)="openTemplateOptions(metaEntityMap, $event)">
        <span class="material-symbols-outlined">settings</span>
      </button>
      <button type="button"
              class="btn-icon-round text-secondary hover-danger"
              title="Delete Template"
              (click)="onDeleteTemplate($event)">
        <span class="material-symbols-outlined">delete</span>
      </button>
    </div>
  </div>
}
