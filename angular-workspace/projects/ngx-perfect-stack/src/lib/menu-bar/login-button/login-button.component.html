<div class="container">
  <div class="row">
    <div class="col">
      @if (authenticationService.isLoggedIn) {
        @if (loginExpiryTime$ | async; as loginExpiryTime) {
          <button class="child btn btn-outline-light ml-2 my-2 my-sm-0" (click)="onLogout()" id="logoutBtn" [attr.data-testid]="'btn-logout'">
            Logout
            @if (showTimeLeft) {
              <span>in {{loginExpiryTime}}</span>
            }
          </button>
        }
      }

      @if (!authenticationService.isLoggedIn) {
        <button class="child btn btn-outline-light ml-2 my-2 my-sm-0" (click)="onLogin()" id="loginBtn" [attr.data-testid]="'btn-login'">Login</button>
      }
    </div>
  </div>
</div>
